<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffcf33">
<title>ProntoNonni</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&text=0123456789&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#151515;--soft:#f5f3ec;--line:#dedad0;--mute:#5c5a54;--sun:#ffcf33;--sunink:#1a1400;--sky:#2357c9;--skybg:#e8efff;--sos:#d93a24;--ok:#1f7a3d;--okbg:#e6f5ea}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Lexend","Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:var(--sun);color:var(--sunink);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(4vw,14px)}
header b{font-size:22px;margin-inline-end:auto}
header .tel{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:20px;padding:8px 14px;border-radius:999px;white-space:nowrap;min-height:44px}
.seg{display:flex;background:rgba(0,0,0,.1);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:10px 16px;border-radius:999px;font-weight:700;min-height:44px}
.seg button[aria-current]{background:#fff}
main{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 100px}
h1{font-size:clamp(30px,7vw,46px);line-height:1.05;margin:8px 0 4px;text-wrap:balance}
h2{font-size:25px;line-height:1.15;margin:34px 0 12px}
.sub{color:var(--mute);margin:0 0 18px}
.now{background:var(--sun);color:var(--sunink);border-radius:28px;padding:22px;display:grid;gap:10px;margin-bottom:16px}
.now.blue{background:var(--skybg);color:var(--ink)}
.now .t{font-size:clamp(56px,16vw,92px);font-weight:700;line-height:1}
.now .m{font-size:26px;font-weight:700;line-height:1.2}
.big{border:0;border-radius:20px;padding:18px 22px;font-size:23px;font-weight:700;min-height:70px;width:100%;background:#151515;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px}
.big.mic svg{width:30px;height:30px}.big.mic.on{background:var(--sos)}.big:disabled{opacity:.5}
.big.sos{background:var(--sos);font-size:27px;min-height:86px}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.med{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:18px}
.med .h{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.med.done{background:var(--okbg);border-color:transparent}.med.late{border-color:var(--sos)}
.tag{font-size:16px;font-weight:700}.tag.ok{color:var(--ok)}.tag.late{color:var(--sos)}
.small{font-size:16px;color:var(--mute)}
.btn{border:2px solid currentColor;background:transparent;border-radius:14px;padding:8px 14px;min-height:48px;font-weight:700}
.btn.fill{background:#151515;color:#fff;border-color:#151515}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.call{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--skybg);color:var(--sky);border-radius:22px;padding:18px 10px;text-decoration:none;min-height:140px;justify-content:center}
.call .av{width:62px;height:62px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:700}
.call b{font-size:21px;color:var(--ink)}
.need{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--soft);border:2px solid var(--line);border-radius:22px;padding:18px 10px;min-height:120px;font-size:20px;font-weight:700}
.need svg{width:42px;height:42px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1 1 200px}
.x{border:0;background:transparent;color:var(--mute);min-width:44px;min-height:44px;font-size:22px;border-radius:12px}
form.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--soft);padding:14px;border-radius:18px;margin-top:12px}
form.add label{display:grid;gap:4px;font-size:15px;color:var(--mute)}
form.add .w{grid-column:1/-1}
input,select,textarea{font-size:16px;min-height:48px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;width:100%}
input[type=checkbox]{width:24px;min-height:24px}
.chk{display:flex!important;align-items:center;gap:10px;color:var(--ink)!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:18px;padding:14px}.stat b{display:block;font-size:clamp(26px,6vw,36px);line-height:1.1}.stat.alert{background:var(--sun)}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--soft);border-radius:22px;max-height:460px;overflow-y:auto}
.bub{max-width:85%;padding:12px 16px;border-radius:20px 20px 20px 6px;background:#fff;font-size:19px;line-height:1.35;align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--skybg);border-radius:20px 20px 6px 20px}
.bub.svc{background:var(--sun)}
.bub small{display:block;font-size:14px;color:var(--mute)}
.bub img,.bub video{display:block;max-width:100%;max-height:320px;border-radius:14px;margin-top:4px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;min-height:48px;font-size:17px;font-weight:700}
.send{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.send input{flex:1 1 220px;font-size:18px;min-height:56px}
.send button,.ico{min-height:56px;border-radius:14px;font-weight:700}
.send button[type=submit]{border:0;padding:0 20px;background:var(--sky);color:#fff;font-size:18px}
.ico{position:relative;min-width:56px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.ico svg{width:26px;height:26px}.ico.on{background:var(--sos);border-color:var(--sos);color:#fff}
.card{max-width:520px;margin:40px auto;display:grid;gap:14px}
.code{font-size:44px;font-weight:700;letter-spacing:.12em;background:var(--sun);border-radius:18px;padding:14px;text-align:center}
.banner{background:var(--sos);color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:16px;font-weight:700}
.banner a{color:#fff}
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--ink);color:#fff;padding:16px max(4vw,16px) 20px;font-size:19px;transform:translateY(110%);transition:transform .25s}
.sheet.on{transform:none}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
.modal.on{display:grid}.modal>div{background:#fff;border-radius:26px;padding:24px;max-width:460px;width:100%;display:grid;gap:12px}
.modal h3{font-size:28px;margin:0}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}form.add{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<header><b>ProntoNonni</b><a class="tel" href="tel:+3906485250" aria-label="Chiama DEXIA allo 06 485250">&#9742; 06 485250</a><nav class="seg" id="tabs" aria-label="Vista"></nav></header>
<main id="app"><p class="sub">Caricamento…</p></main>
<div class="sheet" id="sheet" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div>
  <h3 id="mTitle"></h3><div id="mBody"></div>
  <button class="big" id="mOk" type="button">Sì</button>
  <button class="btn" id="mNo" type="button">No, torna indietro</button>
</div></div>

<script src="/app/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
{
/* ---------- utilità ---------- */
const C = window.PN_CONFIG || {};
const app = document.getElementById('app'), tabsEl = document.getElementById('tabs');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const t5 = t => String(t || '').slice(0, 5);
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = n => pad(Math.floor(n / 60) % 24) + ':' + pad(n % 60);
const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'], MM = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const GIORNI = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const relDay = ds => { const t = new Date(); const a = dkey(t); t.setDate(t.getDate() + 1); return ds === a ? 'Oggi' : ds === dkey(t) ? 'Domani' : ''; };
const fmtAt = iso => { const d = new Date(iso); return (relDay(dkey(d)) || d.getDate() + ' ' + MM[d.getMonth()]) + ' alle ' + hm(d); };
const telHref = p => 'tel:' + String(p).replace(/[^\d+]/g, '');
const NEEDS = [
  ['spesa', 'La spesa', '<path d="M6 9h20l-2 15H8z"/><path d="M11 9a5 5 0 0 1 10 0"/>'],
  ['farmacia', 'Farmacia', '<rect x="5" y="5" width="22" height="22" rx="5"/><path d="M16 10v12M10 16h12"/>'],
  ['passaggio', 'Un passaggio', '<path d="M5 20l3-8h16l3 8v5H5z"/><circle cx="10" cy="24" r="2"/><circle cx="22" cy="24" r="2"/>'],
  ['compagnia', 'Compagnia', '<path d="M16 27S4 19 4 11a6 6 0 0 1 12-1 6 6 0 0 1 12 1c0 8-12 16-12 16z"/>'],
  ['casa', 'Un lavoretto in casa', '<path d="M4 15L16 5l12 10"/><path d="M7 13v13h18V13"/><path d="M13 26v-7h6v7"/>'],
  ['pulizie', 'Le pulizie', '<path d="M20 4l-6 12"/><path d="M8 16h12l3 11H5z"/>']
];
const needName = t => t === 'sos' ? 'Emergenza' : (NEEDS.find(n => n[0] === t) || [, 'Aiuto'])[1];
const QUICK = ['Sto bene', 'Chiamami quando puoi', 'Ho preso le medicine', 'Grazie!', 'Ti voglio bene'];
const ICAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.8"/></svg>';
const IMIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

let tTimer;
function toast(msg) { const s = document.getElementById('sheet'); s.textContent = msg; s.classList.add('on'); clearTimeout(tTimer); tTimer = setTimeout(() => s.classList.remove('on'), 4500); }
const modal = document.getElementById('modal'); let mAction = null;
function ask(title, bodyHtml, okText, action) { document.getElementById('mTitle').textContent = title; document.getElementById('mBody').innerHTML = bodyHtml; document.getElementById('mOk').textContent = okText; mAction = action; modal.classList.add('on'); }
document.getElementById('mOk').onclick = () => { modal.classList.remove('on'); if (mAction) mAction(); };
document.getElementById('mNo').onclick = () => modal.classList.remove('on');

if (!C.url || !C.anonKey || !window.supabase) {
  app.innerHTML = '<div class="card"><h1>Quasi pronto</h1><p>L\'app non è ancora collegata al database. Inserisci Project URL e anon key in <b>app/config.js</b>.</p></div>';
} else {
const sb = window.supabase.createClient(C.url, C.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

/* ---------- stato ---------- */
const S = { user: null, mem: null, operator: null, fam: null, meds: [], logs: [], contacts: [], appts: [], devices: [], checks: [], msgs: [], reqs: [], members: [], invites: [], mail: [], opReqs: [], opFams: [], settings: {}, view: 'nonni', mediaUrls: {}, newCode: null };
async function run(p, okMsg) { const { data, error } = await p; if (error) { toast('Qualcosa non va: ' + error.message); throw error; } if (okMsg) toast(okMsg); return data; }

/* ---------- caricamento dati ---------- */
async function loadAll() {
  const { data: { user } } = await sb.auth.getUser(); S.user = user;
  if (!user) return render();
  const [mem, op] = await Promise.all([
    sb.from('family_members').select('family_id, role, display_name').eq('user_id', user.id).limit(1),
    sb.from('service_operators').select('display_name').eq('user_id', user.id).maybeSingle()
  ]);
  S.mem = (mem.data || [])[0] || null; S.operator = op.data || null;
  { const st = await sb.from('app_settings').select('*').maybeSingle(); S.settings = st.data || {}; }
  if (S.mem) await loadFamily();
  if (S.operator) await loadOperator();
  if (!S.viewSet) { S.view = S.mem ? (S.mem.role === 'nonno' ? 'nonni' : 'famiglia') : (S.operator ? 'servizi' : 'nonni'); S.viewSet = true; }
  subscribe(); render();
}
async function loadFamily() {
  const f = S.mem.family_id, since = new Date(); since.setDate(since.getDate() - 7);
  const q = (t, sel = '*') => sb.from(t).select(sel).eq('family_id', f);
  const [fam, meds, logs, contacts, appts, devices, checks, msgs, reqs, members, invites, mail] = await Promise.all([
    sb.from('families').select('*').eq('id', f).single(),
    q('meds').order('at_time'), q('med_logs').gte('day', dkey(since)), q('contacts').order('name'),
    q('appointments').gte('day', dkey(new Date())).order('day').order('at_time'), q('devices'),
    q('checkins').gte('at', dkey(new Date())).order('at', { ascending: false }),
    q('messages').order('created_at', { ascending: false }).limit(60),
    q('requests').order('created_at', { ascending: false }).limit(30),
    q('family_members', 'user_id, role, display_name'),
    q('family_invites').is('used_at', null).gt('expires_at', new Date().toISOString()),
    q('mail_log').order('checked_at', { ascending: false }).limit(10)
  ]);
  Object.assign(S, { fam: fam.data, meds: meds.data || [], logs: logs.data || [], contacts: contacts.data || [], appts: appts.data || [], devices: devices.data || [], checks: checks.data || [], msgs: (msgs.data || []).reverse(), reqs: reqs.data || [], members: members.data || [], invites: invites.data || [], mail: mail.data || [] });
  await signMedia();
}
async function loadOperator() {
  const { data } = await sb.from('requests').select('*, families(nonno_name, address, zone)').not('svc', 'is', null).order('created_at', { ascending: false }).limit(100);
  S.opReqs = data || [];
  const fams = await sb.from('families').select('id, nonno_name, trial_ends, paid_until, created_at').order('created_at', { ascending: false }).limit(200);
  S.opFams = Array.isArray(fams.data) ? fams.data : [];
}
async function signMedia() {
  const need = S.msgs.filter(m => m.media_path && !S.mediaUrls[m.media_path]).map(m => m.media_path);
  if (!need.length) return;
  const { data } = await sb.storage.from('media').createSignedUrls(need, 3600);
  (data || []).forEach(x => { if (x.signedUrl) S.mediaUrls[x.path] = x.signedUrl; });
}
let chan, reloadT;
function subscribe() {
  if (chan) return;
  const again = () => { clearTimeout(reloadT); reloadT = setTimeout(async () => { if (S.mem) await loadFamily(); if (S.operator) await loadOperator(); if (!busy()) render(); }, 400); };
  chan = sb.channel('pn');
  if (S.mem) ['messages', 'requests', 'checkins', 'med_logs'].forEach(t => chan.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: 'family_id=eq.' + S.mem.family_id }, again));
  if (S.operator) chan.on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, again);
  chan.subscribe();
}
const busy = () => aiBusy || modal.classList.contains('on') || (document.activeElement && app.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) || dictOn;

/* ---------- calcoli ---------- */
const takenToday = id => S.logs.find(l => l.med_id === id && l.day === dkey(new Date()));
function medStatus(m) {
  const tk = takenToday(m.id);
  if (tk) return { cls: 'done', label: 'Presa alle ' + hm(new Date(tk.taken_at)) };
  const n = new Date(); return n.getHours() * 60 + n.getMinutes() > toMin(m.at_time) + 30 ? { cls: 'late', label: 'Da prendere' } : { cls: '', label: '' };
}
function soloInfo() {
  const f = S.fam; if (!f || !f.solo_on) return null;
  const now = new Date(), n = now.getHours() * 60 + now.getMinutes(), a = toMin(f.solo_from), b = toMin(f.solo_to);
  const last = S.checks[0] ? new Date(S.checks[0].at) : null, lm = last ? last.getHours() * 60 + last.getMinutes() : -1;
  const due = Math.max(a, lm) + (f.solo_every || 60);
  return { inWin: n >= a && n <= b, last: last ? hm(last) : '', due: fromMin(due), overdue: n >= a && n <= b + 10 && n > due + 10 };
}
function reqStatus(r) {
  if (r.status === 'fatta') return r.svc ? 'Fatta da DEXIA Service' : 'Fatta';
  if (r.svc === 'presa') return 'DEXIA Service arriva' + (r.svc_eta ? ' alle ' + t5(r.svc_eta) : '');
  if (r.svc === 'richiesta') return 'Inviata a DEXIA Service, in attesa di conferma';
  return r.claimed_by ? 'Ci pensa ' + r.claimed_by : 'In attesa: nessuno se ne occupa ancora';
}
const active = () => S.fam && ((S.fam.paid_until && S.fam.paid_until >= dkey(new Date())) || S.fam.trial_ends >= dkey(new Date()));
const causale = f => 'ProntoNonni ' + f.nonno_name + ' ' + String(f.id).slice(0, 6).toUpperCase();
const daysLeft = d => Math.round((new Date(d + 'T12:00') - new Date(dkey(new Date()) + 'T12:00')) / 864e5);
function payBox() {
  const f = S.fam, st = S.settings || {};
  return `<div class="now blue" style="gap:6px"><div class="m">Rinnovo: ${esc(String(st.price || 20))} € all'anno</div>
  <div>Paga con bonifico a <b>${esc(st.holder || 'D.E.X.I.A. SRL')}</b></div>
  <div>IBAN: <b style="font-variant-numeric:tabular-nums;overflow-wrap:anywhere">${st.iban ? esc(st.iban) : 'in arrivo: scrivi a info@dexiasrl.it'}</b></div>
  <div>Causale: <b>${esc(causale(f))}</b></div>
  <div class="small">Appena riceviamo il bonifico attiviamo l'anno di abbonamento. Ti arriva un messaggio nella chat.</div></div>`;
}
const short = () => (S.fam ? S.fam.nonno_name : '').replace(/^nonn[oa]\s+/i, '');

/* ---------- schermate di accesso ---------- */
function viewLogin() {
  return `<div class="card"><h1>Benvenuti in ProntoNonni</h1>
  <h2>Sono un familiare</h2><p class="small" style="margin:0">Ti mandiamo un'email con il link per entrare, senza password.</p>
  <form data-form="login" class="add" style="grid-template-columns:1fr"><label>La tua email<input name="email" type="email" required autocomplete="email"></label><button class="btn fill" type="submit">Mandami il link</button></form>
  <h2>Questo è il telefono dei nonni</h2><p class="small" style="margin:0">Inserisci il codice che un familiare ha creato nell'app.</p>
  <form data-form="nonnocode" class="add" style="grid-template-columns:1fr"><label>Codice<input name="code" required autocomplete="off" style="font-size:28px;letter-spacing:.1em;text-transform:uppercase"></label><button class="btn fill" type="submit">Entra</button></form></div>`;
}
function viewOnboard() {
  return `<div class="card"><h1>Iniziamo</h1><p>Sei entrato come <b>${esc(S.user.email || 'utente')}</b>.</p>
  <h2>Crea la famiglia</h2>
  <form data-form="newfam" class="add" style="grid-template-columns:1fr"><label>Come chiamate i nonni?<input name="nonno" required placeholder="Es. Nonna Lucia"></label><label>Il tuo nome<input name="me" required placeholder="Es. Diego"></label><button class="btn fill" type="submit">Crea e inizia la prova di 30 giorni</button></form>
  <h2>Ho un codice d'invito</h2>
  <form data-form="join" class="add" style="grid-template-columns:1fr"><label>Codice<input name="code" required autocomplete="off" style="text-transform:uppercase"></label><label>Il tuo nome<input name="me" required></label><button class="btn fill" type="submit">Entra nella famiglia</button></form>
  <p><button class="btn" data-logout="1" type="button">Esci</button></p></div>`;
}

/* ---------- assistente e posta ---------- */
let ai = []; try { ai = JSON.parse(localStorage.getItem('pn-ai')) || []; } catch (e) {}
let aiBusy = false, mailBusy = false;
const AI_QUICK = ['Che medicine devo prendere oggi?', 'Quando è la prossima visita?', 'Raccontami una storia', 'Facciamo un gioco di parole'];
function aiBox() {
  return `<div class="chat" id="aiChat">${ai.length ? ai.map((m, i) => `<div class="bub ${m.role === 'user' ? 'me' : ''}"${i === ai.length - 1 && aiBusy ? ' id="aiLive"' : ''}><small>${m.role === 'user' ? esc(short()) : 'Assistente'}</small>${esc(m.content || 'Sto pensando…')}</div>`).join('') : '<p class="small" style="margin:0">Fammi una domanda, a voce o scrivendo. Sono un assistente, non una persona.</p>'}</div>
  ${SR ? `<button class="big mic${dictOn && dictKey === 'ai' ? ' on' : ''}" data-mic="ai" type="button" style="margin-top:12px"${aiBusy ? ' disabled' : ''}>${IMIC}<span>Tocca e parla</span></button>` : ''}
  <div class="quick">${AI_QUICK.map(q => `<button data-ai="${esc(q)}" type="button"${aiBusy ? ' disabled' : ''}>${esc(q)}</button>`).join('')}</div>
  <form class="send" data-form="ai"><input name="text" aria-label="Scrivi all'assistente" placeholder="Scrivi all'assistente" autocomplete="off"><button type="submit"${aiBusy ? ' disabled' : ''}>Chiedi</button></form>
  ${ai.length && !aiBusy ? '<p><button class="btn" data-aireset="1" type="button">Ricomincia da capo</button></p>' : ''}`;
}
async function askAI(text) {
  if (aiBusy || !text) return;
  ai.push({ role: 'user', content: text.slice(0, 1000) }); ai.push({ role: 'assistant', content: '' }); aiBusy = true; render(); scrollAI();
  const r = await callFn({ family_id: fid(), messages: ai.slice(0, -1).slice(-12) });
  ai[ai.length - 1].content = r.text || r.error || 'Non sono riuscito a rispondere. Riprova tra poco.';
  aiBusy = false; try { localStorage.setItem('pn-ai', JSON.stringify(ai.slice(-40))); } catch (e) {}
  render(); scrollAI(); refresh();
}
async function callFn(body) {
  const { data, error } = await sb.functions.invoke('assistente', { body });
  if (!error) return data || {};
  try { return await error.context.json(); } catch (e) { return {}; }
}
function scrollAI() { const c = document.getElementById('aiChat'); if (c) c.scrollTop = c.scrollHeight; }

  <h2>Abbonamenti</h2>
  ${S.opFams.map(f => { const paid = f.paid_until && f.paid_until >= dkey(new Date()); const trial = f.trial_ends >= dkey(new Date());
    return `<div class="row"><div class="grow"><b>${esc(f.nonno_name)}</b> · <span class="small">causale ${esc(causale(f))}</span><br><span class="small">${paid ? 'Pagato fino al ' + esc(f.paid_until) : trial ? 'In prova fino al ' + esc(f.trial_ends) : 'Prova scaduta il ' + esc(f.trial_ends)}</span></div>
    <button class="btn${paid ? '' : ' fill'}" data-paid="${esc(f.id)}" data-name="${esc(f.nonno_name)}" type="button">Segna pagato (+1 anno)</button></div>`; }).join('') || '<p class="small">Nessuna famiglia iscritta.</p>'}
  <h2>Dati per il bonifico</h2>
  <form class="add" data-form="iban"><label class="w">Intestatario<input name="holder" required value="${esc(S.settings.holder || 'D.E.X.I.A. SRL')}"></label><label class="w">IBAN<input name="iban" required autocomplete="off" value="${esc(S.settings.iban || '')}" placeholder="IT.."></label><button class="btn fill w" type="submit">Salva</button></form>
  ${S.mem ? '' : '<p><button class="btn" data-logout="1" type="button">Esci</button></p>'}`;
}

/* ---------- disegno ---------- */
function render() {
  if (!S.user) { tabsEl.innerHTML = ''; app.innerHTML = viewLogin(); return; }
  if (!S.mem && !S.operator) { tabsEl.innerHTML = ''; app.innerHTML = viewOnboard(); return; }
  const tabs = [];
  if (S.mem) { tabs.push(['nonni', 'Nonni']); if (S.mem.role !== 'nonno') tabs.push(['famiglia', 'Famiglia']); }
  if (S.operator) tabs.push(['servizi', 'Servizi']);
  if (!tabs.some(t => t[0] === S.view)) S.view = tabs[0][0];
  tabsEl.innerHTML = tabs.length > 1 ? tabs.map(t => `<button type="button" data-view="${t[0]}"${t[0] === S.view ? ' aria-current="page"' : ''}>${t[1]}</button>`).join('') : '';
  const banner = S.mem && !active() ? `<div class="banner">La prova gratuita è finita. Rinnova con un bonifico di 20 € all'anno${S.mem.role !== 'nonno' ? ': trovi i dati in Famiglia → Abbonamento.' : '. Chiedi a un familiare.'}</div>` : '';
  app.innerHTML = banner + (S.view === 'servizi' ? viewServizi() : S.view === 'famiglia' ? viewFamiglia() : viewNonni());
  const c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
}

/* ---------- azioni ---------- */
const fid = () => S.mem.family_id;
const refresh = async () => { if (S.mem) await loadFamily(); if (S.operator) await loadOperator(); render(); };
async function addMsg(body, kind, media) {
  await run(sb.from('messages').insert({ family_id: fid(), author_id: S.user.id, author_name: kind === 'nonno' ? S.fam.nonno_name : meName(), kind, body: body || null, ...(media || {}) }));
  await refresh();
}
async function sendMedia(input) {
  const f = input.files && input.files[0], kind = input.dataset.cam === 'msg-n' ? 'nonno' : 'famiglia'; input.value = '';
  if (!f) return; if (f.size > 20 * 1024 * 1024) return toast('Il file è troppo grande: massimo 20 MB.');
  toast('Sto inviando…');
  const path = fid() + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ((f.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi, '').slice(0, 5) || 'jpg');
  await run(sb.storage.from('media').upload(path, f, { contentType: f.type }));
  await addMsg('', kind, { media_path: path, media_type: f.type.startsWith('video') ? 'video' : 'image' });
  toast(f.type.startsWith('video') ? 'Video inviato.' : 'Foto inviata.');
}

app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  try {
    if (d.view) { S.view = d.view; render(); window.scrollTo(0, 0); }
    else if (d.logout) { await sb.auth.signOut(); location.reload(); }
    else if (d.take) { await run(sb.from('med_logs').upsert({ family_id: fid(), med_id: d.take, day: dkey(new Date()) }), 'Perfetto, medicina segnata come presa.'); await refresh(); }
    else if (d.ok) { await run(sb.from('checkins').insert({ family_id: fid() }), 'Grazie! La famiglia vede che stai bene.'); await refresh(); }
    else if (d.quick) addMsg(d.quick, 'nonno');
    else if (d.mic) micClick(d.mic);
    else if (d.paid) { ask('Pagamento ricevuto?', `<p style="margin:0">Confermi di aver ricevuto il bonifico di <b>${esc(d.name)}</b>? L'abbonamento si allunga di un anno.</p>`, 'Sì, segna pagato', async () => { const until = await run(sb.rpc('mark_paid', { p_family: d.paid })); await run(sb.from('messages').insert({ family_id: d.paid, author_id: S.user.id, author_name: 'DEXIA Service', kind: 'servizio', body: 'Grazie! Abbiamo ricevuto il pagamento: ProntoNonni è attivo fino al ' + until + '.' })); toast('Abbonamento attivo fino al ' + until + '.'); await refresh(); }); }
    else if (d.ai) askAI(d.ai);
    else if (d.aireset) { ai = []; try { localStorage.removeItem('pn-ai'); } catch (e) {} render(); }
    else if (d.mailoff) { await run(sb.from('families').update({ mail_consent: false }).eq('id', fid()), 'Posta scollegata.'); await refresh(); }
    else if (d.need) { const sv = (S.fam.auto_service || []).includes(d.need); ask(needName(d.need) + '?', `<p style="font-size:20px;margin:0">${sv ? 'Mando la richiesta al centro servizi DEXIA Service e avviso la famiglia.' : 'Mando la richiesta alla famiglia.'} Qualcuno ti chiamerà.</p>`, 'Sì, invia', async () => { await run(sb.from('requests').insert({ family_id: fid(), type: d.need, svc: sv ? 'richiesta' : null }), 'Richiesta inviata.'); await refresh(); }); }
    else if (b.id === 'sosBtn') { const sos = S.contacts.filter(c => c.sos); ask('Emergenza', `<div class="list"><a class="big sos" href="tel:112">Chiama il 112</a>${sos.map(c => `<a class="big" style="background:var(--sky)" href="${esc(telHref(c.phone))}">Chiama ${esc(c.name)}</a>`).join('')}</div>`, 'Avvisa anche la famiglia', async () => { await run(sb.from('requests').insert({ family_id: fid(), type: 'sos' })); await addMsg('Ho premuto il tasto Emergenza', 'nonno'); toast('Ho avvisato la famiglia.'); }); }
    else if (d.claim) { await run(sb.from('requests').update({ claimed_by: meName() }).eq('id', d.claim), 'Segnato: ci pensi tu.'); await refresh(); }
    else if (d.svc) { await run(sb.from('requests').update({ svc: 'richiesta', claimed_by: null }).eq('id', d.svc), 'Affidata a DEXIA Service.'); await refresh(); }
    else if (d.done) { await run(sb.from('requests').update({ status: 'fatta' }).eq('id', d.done), 'Richiesta segnata come fatta.'); await refresh(); }
    else if (d.del) { ask('Eliminare?', '<p style="margin:0">Questa voce verrà eliminata.</p>', 'Sì, elimina', async () => { await run(sb.from(d.del).delete().eq('id', d.id), 'Eliminato.'); await refresh(); }); }
    else if (d.solooff) { await run(sb.from('families').update({ solo_on: false }).eq('id', fid()), 'Controllo disattivato.'); await refresh(); }
    else if (d.invite) { const r = await run(sb.from('family_invites').insert({ family_id: fid(), role: d.invite, created_by: S.user.id }).select('code, role').single()); S.newCode = r; render(); }
    else if (d.svcdone) { await run(sb.from('requests').update({ status: 'fatta' }).eq('id', d.svcdone)); await run(sb.from('messages').insert({ family_id: d.fam, author_id: S.user.id, author_name: 'DEXIA Service', kind: 'servizio', body: 'Abbiamo completato: ' + needName(d.type).toLowerCase() + '. Grazie!' }), 'Richiesta completata.'); await refresh(); }
  } catch (err) { console.error(err); }
});
app.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.cam) sendMedia(e.target).catch(console.error); });
app.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, k = f.dataset.form, v = Object.fromEntries(new FormData(f));
  if (dictOn) stopMic();
  try {
    if (k === 'login') { await run(sb.auth.signInWithOtp({ email: v.email.trim(), options: { emailRedirectTo: location.origin + '/app/' } })); app.innerHTML = `<div class="card"><h1>Controlla la posta</h1><p>Ti abbiamo mandato un link a <b>${esc(v.email)}</b>. Aprilo da questo telefono per entrare.</p></div>`; }
    else if (k === 'nonnocode') { const { error } = await sb.auth.signInAnonymously(); if (error) return toast('Accesso non riuscito: ' + error.message); await run(sb.rpc('join_family', { p_code: v.code, p_my_name: 'Telefono dei nonni' })); S.viewSet = false; await loadAll(); }
    else if (k === 'newfam') { await run(sb.rpc('create_family', { p_nonno_name: v.nonno.trim(), p_my_name: v.me.trim() }), 'Famiglia creata: 30 giorni di prova gratuita.'); S.viewSet = false; S.view = 'famiglia'; await loadAll(); }
    else if (k === 'join') { await run(sb.rpc('join_family', { p_code: v.code, p_my_name: v.me.trim() }), 'Sei entrato nella famiglia.'); S.viewSet = false; await loadAll(); }
    else if (k === 'iban') { await run(sb.from('app_settings').update({ holder: v.holder.trim(), iban: v.iban.replace(/\s+/g, ' ').trim().toUpperCase() }).eq('id', 1), 'Dati del bonifico salvati.'); const st = await sb.from('app_settings').select('*').maybeSingle(); S.settings = st.data || {}; render(); }
    else if (k === 'ai') { if (v.text.trim()) askAI(v.text.trim()); }
    else if (k === 'mail') { await run(sb.from('families').update({ mail_address: v.addr.trim(), mail_consent: !!v.consent }).eq('id', fid()), 'Controllo della posta attivato.'); await refresh(); }
    else if (k === 'mailcheck') { mailBusy = true; render(); const data = await callFn({ family_id: fid(), mode: 'posta', text: v.text }); mailBusy = false; toast(data.item ? (data.item.kind === 'truffa' ? 'Possibile truffa: avvisati nonni e famiglia.' : 'Email controllata.') : data.error || 'Controllo non riuscito, riprova.'); await refresh(); }
    else if (k === 'msg-n' || k === 'msg-f') { if (v.text.trim()) await addMsg(v.text.trim().slice(0, 2000), k === 'msg-n' ? 'nonno' : 'famiglia'); }
    else if (k === 'meds') { await run(sb.from('meds').insert({ family_id: fid(), name: v.name.trim(), dose: v.dose.trim(), at_time: v.at_time, note: v.note.trim() || null }), 'Medicina aggiunta.'); await refresh(); }
    else if (k === 'appointments') { await run(sb.from('appointments').insert({ family_id: fid(), day: v.day, at_time: v.at_time, title: v.title.trim(), place: v.place.trim() || null, companion: v.companion.trim() || null }), 'Appuntamento aggiunto.'); await refresh(); }
    else if (k === 'contacts') { await run(sb.from('contacts').insert({ family_id: fid(), name: v.name.trim(), rel: v.rel.trim() || null, phone: v.phone.trim(), sos: !!v.sos }), 'Contatto aggiunto.'); await refresh(); }
    else if (k === 'devices') { const link = v.link.trim(); await run(sb.from('devices').insert({ family_id: fid(), name: v.name.trim(), app: v.app.trim(), link: /^https:\/\//.test(link) ? link : null, note: v.note.trim() || null }), 'Dispositivo aggiunto.'); await refresh(); }
    else if (k === 'solo') { if (toMin(v.from) >= toMin(v.to)) return toast("L'ora di fine deve venire dopo quella di inizio."); await run(sb.from('families').update({ solo_on: true, solo_from: v.from, solo_to: v.to, solo_every: Number(v.every) }).eq('id', fid()), 'Controllo attivato.'); await refresh(); }
    else if (k === 'settings') { await run(sb.from('families').update({ nonno_name: v.nonno.trim(), address: v.address.trim() || null, auto_service: NEEDS.map(n => n[0]).filter(t => v['svc_' + t]) }).eq('id', fid()), 'Impostazioni salvate.'); await refresh(); }
    else if (k === 'svctake') { await run(sb.from('requests').update({ svc: 'presa', svc_eta: v.eta, svc_operator: S.user.id }).eq('id', f.dataset.id)); const r = S.opReqs.find(x => x.id === f.dataset.id); await run(sb.from('messages').insert({ family_id: f.dataset.fam, author_id: S.user.id, author_name: 'DEXIA Service', kind: 'servizio', body: 'Abbiamo preso in carico: ' + needName(r ? r.type : '').toLowerCase() + '. Arriviamo alle ' + v.eta + '.' }), 'Presa in carico: la famiglia è avvisata.'); await refresh(); }
  } catch (err) { console.error(err); }
});
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) { S.view = b.dataset.view; render(); window.scrollTo(0, 0); } });

/* ---------- microfono (dettatura del browser) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, dictOn = false, dictKey = null, dictBase = '';
function micInput() { return document.querySelector(`[data-form="${dictKey}"] input[name=text]`) || (dictKey === 'ai' ? document.querySelector('[data-form="ai"] input[name=text]') : null); }
function stopMic() { try { rec && rec.stop(); } catch (e) {} }
function micClick(key) {
  if (!SR) return toast('Usa il microfono della tastiera del telefono.');
  if (dictOn) return stopMic();
  dictKey = key; const i = micInput(); dictBase = i ? i.value : '';
  rec = new SR(); rec.lang = 'it-IT'; rec.interimResults = true; rec.continuous = true;
  rec.onresult = ev => { let fin = '', tmp = ''; for (const r of ev.results) (r.isFinal ? (fin += r[0].transcript) : (tmp += r[0].transcript)); const el = micInput(); if (el) el.value = (dictBase + ' ' + fin + ' ' + tmp).replace(/\s+/g, ' ').trim(); };
  rec.onend = () => { if (dictKey === 'ai') { const el = micInput(); const t = el ? el.value.trim() : ''; if (t) { el.value = ''; setTimeout(() => askAI(t), 0); } } dictOn = false; document.querySelectorAll('[data-mic]').forEach(x => x.classList.remove('on')); };
  rec.onerror = () => toast('Il microfono non è disponibile.');
  try { rec.start(); dictOn = true; document.querySelectorAll(`[data-mic="${key}"]`).forEach(x => x.classList.add('on')); } catch (e) { toast('Il microfono non è disponibile.'); }
}

/* ---------- avvio ---------- */
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') loadAll(); });
loadAll();
setInterval(() => { if (!busy()) render(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js').catch(() => {});
}
}
</script>
